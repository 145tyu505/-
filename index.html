<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玉山クイズ (玉山快問快答)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #bfdbfe);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .question-box {
            font-size: 18px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        button.option-btn {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        button.option-btn:hover:not(:disabled) {
            background: #eff6ff;
            border-color: #3b82f6;
        }
        button.option-btn.correct {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534;
        }
        button.option-btn.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b;
        }
        .feedback {
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 48px;
        }
        .next-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            display: none;
            width: 100%;
            font-weight: bold;
        }
        .next-btn:hover {
            background: #2563eb;
        }
        .score-board {
            text-align: center;
            font-size: 22px;
            color: #1e3a8a;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>玉山クイズ</h1>
    <div class="subtitle">台湾の最高峰・玉山に関する日本語クイズゲーム（全10問）</div>
    
    <div id="quiz-container">
        <div id="progress" style="margin-bottom: 10px; color: #64748b; font-size: 14px;"></div>
        <div class="question-box" id="question-text"></div>
        <div class="options" id="options-container"></div>
        <div class="feedback" id="feedback-text"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ (下一題)</button>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "Q1. 玉山の標高（高さ）はどれくらいですか？",
            options: ["3,952メートル", "3,860メートル", "3,500メートル", "4,000メートル"],
            answer: 0,
            explanation: "正解：3,952メートル（玉山是臺灣及東北亞的第一高峰）"
        },
        {
            question: "Q2. 玉山は台湾のどのあたりに位置していますか？",
            options: ["北部", "南部", "中部", "東部"],
            answer: 2,
            explanation: "正解：中部（玉山主峰座落於臺灣中部，橫跨南投縣、嘉義縣及高雄市）"
        },
        {
            question: "Q3. 玉山の形が何に似ていることからその名前がつきましたか？",
            options: ["刀の刃", "削り取られた玉（ぎょく）", "大きな屏風", "タケノコ"],
            answer: 1,
            explanation: "正解：削り取られた玉（峰巒積雪時遠望如玉石般純白，故得名）"
        },
        {
            question: "Q4. 玉山国立公園でよく見られる代表的な台湾の固有種（動物）はどれですか？",
            options: ["ホッキョクグマ", "タイワンカモシカ", "カンガルー", "ペンギン"],
            answer: 1,
            explanation: "正解：タイワンカモシカ（臺灣長鬃山羊是臺灣特有種動物）"
        },
        {
            question: "Q5. 日本統治時代、玉山は別の名前で呼ばれていました。その名前は何ですか？",
            options: ["新高山（にいたかやま）", "富士山", "阿里山", "モリソン山"],
            answer: 0,
            explanation: "正解：新高山（當時因高度超越日本本土的富士山而得名）"
        },
        {
            question: "Q6. 玉山の主峰に登るための主な出発点（登山口）はどこですか？",
            options: ["合歓山（ごうかんざん）", "阿里山（ありさん）", "太魯閣（タロコ）", "塔塔加（タタカ）"],
            answer: 3,
            explanation: "正解：塔塔加（前往玉山主峰最主要、最大眾化的登山口是塔塔加鞍部）"
        },
        {
            question: "Q7. 玉山が属している山脈の名前は何ですか？",
            options: ["中央山脈", "雪山山脈", "玉山山脈", "海岸山脈"],
            answer: 2,
            explanation: "正解：玉山山脈（玉山是玉山山脈的最高峰）"
        },
        {
            question: "Q8. 台湾の登山家が目標とする「台湾百岳」の中で、玉山はランキング何位ですか？",
            options: ["1位", "2位", "3位", "10位"],
            answer: 0,
            explanation: "正解：1位（玉山是臺灣百岳之首，也是第一高峰）"
        },
        {
            question: "Q9. 現在、玉山主峰の山頂にある石碑には何と書かれていますか？",
            options: ["台湾最高峰", "玉山主峰", "新高山", "アジア第一峰"],
            answer: 1,
            explanation: "正解：玉山主峰（山頂的石碑上刻有「玉山主峰」及海拔高度3952公尺）"
        },
        {
            question: "Q10. 玉山は日本のどの山より高いことから「新高山」と名付けられましたか？",
            options: ["槍ヶ岳", "阿蘇山", "筑波山", "富士山"],
            answer: 3,
            explanation: "正解：富士山（因為標高3952公尺，超過了日本最高峰富士山的3776公尺）"
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const feedbackText = document.getElementById("feedback-text");
    const nextBtn = document.getElementById("next-btn");
    const progressText = document.getElementById("progress");

    function loadQuestion() {
        feedbackText.textContent = "";
        nextBtn.style.display = "none";
        
        const currentQ = quizData[currentQuestionIndex];
        progressText.textContent = `問題 ${currentQuestionIndex + 1} / ${quizData.length}`;
        questionText.textContent = currentQ.question;
        
        optionsContainer.innerHTML = "";
        currentQ.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.classList.add("option-btn");
            btn.textContent = option;
            btn.onclick = () => selectAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex, selectedBtn) {
        const currentQ = quizData[currentQuestionIndex];
        const allButtons = optionsContainer.querySelectorAll(".option-btn");
        
        // 禁用所有按鈕
        allButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentQ.answer) {
            selectedBtn.classList.add("correct");
            feedbackText.style.color = "#16a34a";
            feedbackText.innerHTML = `正解！🎉<br><span style="font-size: 14px; font-weight: normal; color: #475569;">${currentQ.explanation}</span>`;
            score++;
        } else {
            selectedBtn.classList.add("wrong");
            allButtons[currentQ.answer].classList.add("correct");
            feedbackText.style.color = "#dc2626";
            feedbackText.innerHTML = `不正解...❌<br><span style="font-size: 14px; font-weight: normal; color: #475569;">${currentQ.explanation}</span>`;
        }

        if (currentQuestionIndex < quizData.length - 1) {
            nextBtn.style.display = "block";
        } else {
            nextBtn.style.display = "block";
            nextBtn.textContent = "結果を見る (看結果)";
            nextBtn.onclick = showResult;
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function showResult() {
        const container = document.getElementById("quiz-container");
        let evaluation = "";
        
        // 根據10題的得分給予不同的評語
        if (score === 10) {
            evaluation = "完璧です！玉山マスターですね！<br>(太完美了！你是玉山達人！)";
        } else if (score >= 7) {
            evaluation = "素晴らしい！よくできました！<br>(做得很好！很厲害喔！)";
        } else if (score >= 4) {
            evaluation = "いい調子です！<br>(表現不錯！繼續保持！)";
        } else {
            evaluation = "もう少し頑張りましょう！<br>(再接再厲！)";
        }

        container.innerHTML = `
            <div class="score-board">
                <h2>ゲーム終了 (遊戲結束)</h2>
                <p>正解数 (答對題數)：${score} / ${quizData.length}</p>
                <p style="font-size: 18px; color: #475569; margin-top: 15px; line-height: 1.5;">${evaluation}</p>
                <button class="next-btn" style="display: block; margin-top: 20px;" onclick="location.reload()">もう一度プレイ (再玩一次)</button>
            </div>
        `;
    }

    // 初始化遊戲
    loadQuestion();
</script>

</body>
</html>
